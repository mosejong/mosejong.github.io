name: Wake Procurement App and Refresh Capture

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/wake-procurement-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Korean fonts and browser helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f
          python -m pip install --quiet selenium pillow

      - name: Capture live procurement dashboard
        env:
          APP_URL: https://procurement-logistics-ai-5qian47widxpcuqefpjipy.streamlit.app
        run: |
          mkdir -p assets/projects
          cat > /tmp/capture.py <<'PY'
          import os, time
          from pathlib import Path
          from PIL import Image, ImageStat
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url = os.environ['APP_URL']
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'assets/projects/procurement-home.png'
          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1440,1100')
          opts.add_argument('--hide-scrollbars')
          opts.add_argument('--lang=ko-KR')

          def quality(path):
              im = Image.open(path).convert('RGB')
              w,h = im.size
              crop = im.crop((int(w*.08), int(h*.08), int(w*.92), int(h*.92)))
              stat = ImageStat.Stat(crop)
              std = sum(stat.stddev) / 3
              colors = crop.resize((180,140)).getcolors(maxcolors=180*140) or []
              return std, len(colors), path.stat().st_size

          driver = webdriver.Chrome(options=opts)
          try:
              best = None
              for i in range(4):
                  driver.get(url)
                  time.sleep(18 if i == 0 else 12)
                  driver.execute_script('window.scrollTo(0,0)')
                  time.sleep(2)
                  p = Path(os.environ['GITHUB_WORKSPACE']) / f'candidate-{i+1}.png'
                  driver.save_screenshot(str(p))
                  q = quality(p)
                  print('candidate', i+1, q)
                  if best is None or q[0] > best[0][0]:
                      best = (q,p)
                  if q[0] > 18 and q[1] > 500 and q[2] > 90000:
                      best = (q,p)
                      break
              q,p = best
              if not (q[0] > 12 and q[1] > 250 and q[2] > 60000):
                  raise RuntimeError(f'Capture looks blank: {q}')
              out.write_bytes(p.read_bytes())
              print('Selected', q, out)
          finally:
              driver.quit()
          PY
          python /tmp/capture.py

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects/procurement-home.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
            exit 0
          fi
          git commit -m "fix: capture live procurement dashboard with Korean fonts"
          git push

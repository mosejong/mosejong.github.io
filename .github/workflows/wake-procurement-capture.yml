name: Wake Procurement App and Refresh Capture

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/wake-procurement-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: Capture live procurement dashboard
        env:
          APP_URL: https://procurement-logistics-ai-5qian47widxpcuqefpjipy.streamlit.app
        run: |
          mkdir -p assets/projects
          cat > /tmp/capture.py <<'PY'
          import os, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          url = os.environ['APP_URL']
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'assets/projects/procurement-home.png'
          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1440,1100')
          opts.add_argument('--hide-scrollbars')

          driver = webdriver.Chrome(options=opts)
          try:
              ok = False
              last = ''
              for i in range(12):
                  driver.get(url)
                  time.sleep(8)
                  try:
                      last = driver.find_element(By.TAG_NAME, 'body').text
                  except Exception:
                      last = ''
                  low = last.lower()
                  print(f'attempt {i+1}: {last[:160]!r}')
                  if 'zzzz' not in low and 'gone to sleep' not in low and 'get this app back up' not in low and len(last.strip()) > 40:
                      ok = True
                      break
                  time.sleep(4)
              if not ok:
                  raise RuntimeError('Live app not detected: ' + last[:500])
              time.sleep(12)
              driver.execute_script('window.scrollTo(0,0)')
              time.sleep(2)
              driver.save_screenshot(str(out))
              print('Saved:', out, out.stat().st_size)
          finally:
              driver.quit()
          PY
          python /tmp/capture.py

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects/procurement-home.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
            exit 0
          fi
          git commit -m "fix: use live procurement dashboard capture"
          git push

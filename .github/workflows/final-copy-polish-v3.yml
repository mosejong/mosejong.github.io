name: Final Copy Polish V3

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Patch recruiter-facing labels
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = [
              ('AI 백엔드 개발자 모세종의 포트폴리오.', 'AI 서비스 백엔드 개발자 모세종의 포트폴리오.'),
              ('AI 백엔드 개발자 포트폴리오.', 'AI 서비스 백엔드 개발자 포트폴리오.'),
              ('<div class="role-box proof"><small>VALIDATION</small><strong>564 project backend tests</strong></div>', '<div class="role-box proof"><small>PROJECT TESTS</small><strong>564 project backend tests</strong></div>'),
              ('PYTHON · FASTAPI · AI BACKEND · SEOUL', 'PYTHON · FASTAPI · AI SERVICE BACKEND · SEOUL'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly 1 occurrence: {old!r}, got {count}')
              text = text.replace(old, new)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/final-copy-polish-v3.yml
          git add index.html .github/workflows/final-copy-polish-v3.yml
          git diff --cached --check
          git commit -m "copy: finalize recruiter-facing labels"
          git push origin main

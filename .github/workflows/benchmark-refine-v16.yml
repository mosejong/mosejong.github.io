name: Portfolio Benchmark Refine v1.6

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/benchmark-refine-v16.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply refinement
        run: |
          python .github/scripts/benchmark_refine_v16.py
          sed -i 's/[[:space:]]\+$//' index.html assets/case-study.css
      - name: Validate
        run: |
          git diff --check
          grep -q "Field → Backend" index.html
          grep -q "재고 · 납기 → 상태 · 우선순위" index.html
          grep -q "v1.6b — Korean case-study heading fit" assets/case-study.css
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/case-study.css
          git commit -m "design: refine benchmarked portfolio scanability"
          git push

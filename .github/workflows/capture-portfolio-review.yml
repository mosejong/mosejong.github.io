name: Capture Portfolio Review

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/capture-portfolio-review.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install browser helpers
        run: python -m pip install --quiet selenium pillow
      - name: Capture desktop and mobile
        run: |
          cat > /tmp/capture_portfolio.py <<'PY'
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url='https://mosejong.github.io'
          out=Path('review-captures')
          out.mkdir(exist_ok=True)

          def capture(name,w,h):
              opts=Options()
              opts.add_argument('--headless=new')
              opts.add_argument('--no-sandbox')
              opts.add_argument('--disable-dev-shm-usage')
              opts.add_argument(f'--window-size={w},{h}')
              driver=webdriver.Chrome(options=opts)
              try:
                  driver.get(url)
                  time.sleep(8)
                  total=driver.execute_script('return Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)')
                  driver.set_window_size(w, min(total+100,12000))
                  time.sleep(3)
                  driver.save_screenshot(str(out/f'{name}.png'))
                  print(name, 'height=', total)
              finally:
                  driver.quit()

          capture('desktop',1440,900)
          capture('mobile',430,900)
          PY
          python /tmp/capture_portfolio.py
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-captures
          path: review-captures/*.png

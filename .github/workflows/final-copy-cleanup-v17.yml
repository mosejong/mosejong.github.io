name: Final Portfolio Copy Cleanup v1.7

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/final-copy-cleanup-v17.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply copy cleanup
        run: python .github/scripts/final_copy_cleanup_v17.py
      - name: Validate diff
        run: |
          git diff --check
          git diff -- index.html projects/schoolbridge.html projects/jobiverse.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/schoolbridge.html projects/jobiverse.html
          git commit -m "fix: finalize portfolio copy accuracy" || exit 0
          git push

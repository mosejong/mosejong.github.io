name: Recapture SchoolBridge Korean UI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recapture-schoolbridge-ko.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
          fc-match 'Noto Sans CJK KR'

      - name: Capture real SchoolBridge design references
        run: |
          mkdir -p assets/projects
          rm -rf /tmp/schoolbridge
          git clone --depth 1 https://github.com/Maxmunzy/multicultural-ai.git /tmp/schoolbridge
          cd /tmp/schoolbridge/android/design_reference
          python3 -m http.server 8123 >/tmp/schoolbridge-http.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --lang=ko-KR --window-size=1440,900 --virtual-time-budget=3000 --run-all-compositor-stages-before-draw --screenshot="$GITHUB_WORKSPACE/assets/projects/schoolbridge-parent.png" http://127.0.0.1:8123/parent.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --lang=ko-KR --window-size=1440,900 --virtual-time-budget=3000 --run-all-compositor-stages-before-draw --screenshot="$GITHUB_WORKSPACE/assets/projects/schoolbridge-teacher.png" http://127.0.0.1:8123/teacher.html
          kill "$SERVER_PID" || true
          test -s "$GITHUB_WORKSPACE/assets/projects/schoolbridge-parent.png"
          test -s "$GITHUB_WORKSPACE/assets/projects/schoolbridge-teacher.png"

      - name: Commit corrected screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects/schoolbridge-parent.png assets/projects/schoolbridge-teacher.png
          if git diff --cached --quiet; then
            echo "SchoolBridge screenshots unchanged"
            exit 0
          fi
          git commit -m "fix: render Korean text in SchoolBridge previews"
          git push

name: Final Portfolio v1 QA

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/final-qa-v1.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Korean font and Selenium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
          python -m pip install --quiet selenium
      - name: Serve and capture cards
        run: |
          python -m http.server 8000 >/tmp/site.log 2>&1 &
          sleep 2
          mkdir -p qa-final
          cat > /tmp/qa.py <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          def driver_for(w,h):
              o=Options()
              o.add_argument('--headless=new')
              o.add_argument('--no-sandbox')
              o.add_argument('--disable-dev-shm-usage')
              o.add_argument(f'--window-size={w},{h}')
              return webdriver.Chrome(options=o)

          def capture(name,index,w,h):
              d=driver_for(w,h)
              try:
                  d.get('http://127.0.0.1:8000')
                  time.sleep(4)
                  cards=d.find_elements(By.CSS_SELECTOR,'.project-list .project')
                  assert len(cards)>=4, len(cards)
                  d.execute_script("arguments[0].scrollIntoView({block:'center'});", cards[index])
                  time.sleep(3)
                  d.save_screenshot(f'qa-final/{name}.png')
              finally:
                  d.quit()

          capture('01-jobiverse-desktop',0,1440,900)
          capture('02-schoolbridge-desktop',1,1440,900)
          capture('03-rainbow-desktop',2,1440,900)
          capture('04-procurement-desktop',3,1440,900)
          capture('05-schoolbridge-mobile',1,430,900)
          capture('06-procurement-mobile',3,430,900)
          PY
          python /tmp/qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-v1-final-qa
          path: qa-final/*.png

name: Refine Case Study Typography

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-case-study-type.yml"

permissions:
  contents: write

jobs:
  fix-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch responsive hero typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/case-study.css')
          s = p.read_text(encoding='utf-8')
          pairs = [
            ('.hero-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:54px;align-items:center}', '.hero-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:54px;align-items:center}.hero-grid>*{min-width:0}'),
            ('.hero h1 span{display:block;background:', '.hero h1 span{display:block;font-size:.56em;line-height:1.05;letter-spacing:-.055em;margin-top:6px;background:'),
            ('.hero h1{font-size:clamp(50px,16vw,76px)}', '.hero h1{font-size:clamp(44px,13.5vw,62px);line-height:.93}.hero h1 span{font-size:.72em;line-height:1.06;letter-spacing:-.04em;margin-top:5px}')
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f'CSS pattern missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'font-size:.56em' assets/case-study.css
          grep -q '13.5vw' assets/case-study.css

      - name: Install Korean fonts and serve
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          fc-cache -f
          python3 -m http.server 8123 >/tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          sleep 2
          mkdir -p /tmp/case-study-type-qa

      - name: Capture corrected layouts
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=/tmp/case-study-type-qa/01-jobiverse-desktop.png http://127.0.0.1:8123/projects/jobiverse.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=/tmp/case-study-type-qa/02-schoolbridge-desktop.png http://127.0.0.1:8123/projects/schoolbridge.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=/tmp/case-study-type-qa/03-rainbow-desktop.png http://127.0.0.1:8123/projects/rainbow-bridge.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=/tmp/case-study-type-qa/04-procurement-desktop.png http://127.0.0.1:8123/projects/procurement-logistics-ai.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=6000 --screenshot=/tmp/case-study-type-qa/05-jobiverse-mobile.png http://127.0.0.1:8123/projects/jobiverse.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=6000 --screenshot=/tmp/case-study-type-qa/06-procurement-mobile.png http://127.0.0.1:8123/projects/procurement-logistics-ai.html
          kill "$(cat /tmp/portfolio-http.pid)" || true

      - name: Upload corrected QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: case-study-type-qa
          path: /tmp/case-study-type-qa/*.png
          retention-days: 7

      - name: Commit fix and remove one-off workflow
        run: |
          git rm .github/workflows/fix-case-study-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refine case study hero typography"
          git push
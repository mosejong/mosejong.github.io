name: Final Main Release Copy Fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-main-release-copy.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix main metadata and SchoolBridge disclosure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<meta name="description" content="모세종 | Python · FastAPI 기반 AI 서비스 백엔드 개발자 포트폴리오" />', '<meta name="description" content="물류·운영 경험을 바탕으로 Python · FastAPI로 API, DB, AI 기능을 연결하고 테스트와 수치로 검증하는 AI 백엔드 개발자 모세종의 포트폴리오." />'),
              ('<meta property="og:title" content="모세종 | AI Backend Developer" />', '<meta property="og:title" content="모세종 | Python · FastAPI AI Backend Developer" />'),
              ('<meta property="og:description" content="현장의 문제를 데이터 흐름으로 정리하고, 코드와 AI로 해결합니다." />', '<meta property="og:description" content="물류·운영 경험을 바탕으로 Python · FastAPI로 API, DB, AI 기능을 연결하고 테스트와 수치로 검증하는 AI 백엔드 개발자 포트폴리오." />'),
              ('SERVICE UI · PARENT / TEACHER', 'DESIGN REFERENCE · PARENT / TEACHER'),
              ('alt="SchoolBridge 학부모 앱 UI 흐름"', 'alt="SchoolBridge 학부모 UI 디자인 레퍼런스"'),
              ('alt="SchoolBridge 선생님 앱 UI 흐름"', 'alt="SchoolBridge 선생님 UI 디자인 레퍼런스"'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected text missing: ' + old[:80])
              s = s.replace(old, new, 1)
          assert s.count('property="og:title"') == 1
          assert s.count('property="og:description"') == 1
          assert 'DESIGN REFERENCE · PARENT / TEACHER' in s
          assert 'RAG evidence <b>95% → 100%</b>' in s
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/fix-main-release-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align main metadata and project evidence labels"
          git push

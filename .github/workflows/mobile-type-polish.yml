name: Responsive Typography Polish

on:
  push:
    paths:
      - '.github/workflows/mobile-type-polish.yml'

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch responsive typography
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          old_title = '<div class="manifesto-title">현장의 병목을 보던 사람이,<br><span class="hero-accent">서비스의 병목</span>을 봅니다.</div>'
          new_title = '<div class="manifesto-title"><span class="manifesto-line">현장의 병목을 보던 사람이,</span><span class="manifesto-line"><span class="hero-accent">서비스의 병목</span>을 봅니다.</span></div>'
          if text.count(old_title) != 1:
              raise SystemExit(f'manifesto title occurrence mismatch: {text.count(old_title)}')
          text = text.replace(old_title, new_title)

          marker = '\n  </style>'
          if text.count(marker) != 1:
              raise SystemExit('index style closing marker mismatch')

          responsive_css = r'''

    /* v1.7 — responsive typography / clipping defense */
    .manifesto-title,.section-top h2,.project h3,.award-title,.cta h2{
      word-break:keep-all;
      overflow-wrap:break-word;
    }
    .manifesto-line{display:block}
    .metric,.role-box strong,.origin-note strong,.work-principle span,.time-content strong,.time-content p{
      max-width:100%;
      overflow-wrap:anywhere;
    }
    @media(max-width:980px){
      .manifesto{min-height:auto;gap:34px}
      .manifesto-title{font-size:clamp(38px,6.1vw,54px);line-height:1.08;letter-spacing:-.05em}
    }
    @media(max-width:680px){
      .manifesto{padding:24px 20px;min-height:0;gap:24px}
      .manifesto-title{font-size:clamp(30px,8.9vw,38px);line-height:1.12;letter-spacing:-.043em;margin-top:16px}
      .manifesto p{margin:0;font-size:14px;line-height:1.72;word-break:keep-all}
      .section-top h2{font-size:clamp(32px,9.4vw,42px);line-height:1.09;letter-spacing:-.045em}
      .impact{font-size:clamp(38px,11.3vw,54px);line-height:1.04;letter-spacing:-.055em;overflow-wrap:anywhere}
      .award-title{font-size:21px;line-height:1.22;letter-spacing:-.035em}
      .project h3,.project-featured-real h3{font-size:clamp(34px,10vw,42px);line-height:1.07;letter-spacing:-.045em}
      .project-copy p,.section-note,.bento-copy,.work-principle span{word-break:keep-all;overflow-wrap:break-word}
      .metric{white-space:normal;line-height:1.45}
      .scan-grid .role-box strong{line-height:1.55}
      .origin-note strong{line-height:1.6}
      .cta-box{min-height:0;padding:46px 18px}
      .cta h2{font-size:clamp(30px,8.9vw,40px);line-height:1.11;letter-spacing:-.045em}
      .node{grid-template-columns:36px minmax(0,1fr) auto;gap:10px;padding:14px}
      .node-icon{width:36px;height:36px}
      .node strong{font-size:12px;line-height:1.3}
      .node small{font-size:9px;overflow-wrap:anywhere}
      .node-state{font-size:9px;padding:5px 6px}
    }
    @media(max-width:420px){
      .hero h1{font-size:clamp(31px,8.6vw,38px);line-height:1.1;letter-spacing:-.035em}
      .manifesto-title{font-size:clamp(28px,8.5vw,34px)}
      .project h3,.project-featured-real h3{font-size:clamp(32px,9.4vw,38px)}
      .impact{font-size:clamp(35px,10.5vw,46px)}
      .visual-caption{flex-wrap:wrap;justify-content:flex-end;line-height:1.4}
    }
'''
          text = text.replace(marker, responsive_css + marker)
          index.write_text(text, encoding='utf-8')

          css = Path('assets/case-study.css')
          ctext = css.read_text(encoding='utf-8')
          if '/* v1.7 — mobile typography / clipping defense */' in ctext:
              raise SystemExit('case study responsive patch already present')
          ctext += r'''

/* v1.7 — mobile typography / clipping defense */
.hero h1,.section h2,.owned-big h3,.card h3,.decision h3,.nextbox h3,.lesson strong{
  word-break:keep-all;
  overflow-wrap:break-word;
}
.badge,.visual-label,.stat small,.stat strong,.stat p,.result span,.result strong,.owned-item strong,.owned-item span{
  max-width:100%;
  overflow-wrap:anywhere;
}
.visual-label{white-space:normal;line-height:1.4}
@media(max-width:900px){
  .section h2{font-size:clamp(35px,6.5vw,52px);line-height:1.08;letter-spacing:-.05em}
  .owned-big h3{line-height:1.08}
}
@media(max-width:640px){
  .hero h1{font-size:clamp(39px,11.4vw,52px);line-height:1.03;letter-spacing:-.052em}
  .hero h1 span{line-height:1.12;letter-spacing:-.035em}
  .eyebrow{line-height:1.5;overflow-wrap:anywhere}
  .lead{font-size:15px;line-height:1.76;word-break:keep-all}
  .badge{min-height:0;padding:7px 10px;line-height:1.35;white-space:normal}
  .visual-label{font-size:9px;letter-spacing:.04em}
  .stat{min-height:auto;padding:17px}
  .stat strong{margin-top:14px;font-size:clamp(24px,7vw,30px);line-height:1.08;letter-spacing:-.04em}
  .stat p{line-height:1.55}
  .section h2{font-size:clamp(31px,9vw,40px);line-height:1.11;letter-spacing:-.043em}
  .section-intro{font-size:14px;line-height:1.78;word-break:keep-all}
  .card h3,.decision h3{line-height:1.34}
  .card p,.decision p,.owned-big .quote,.owned-item span,.lesson p{word-break:keep-all;overflow-wrap:break-word}
  .owned-big h3{font-size:clamp(29px,8.8vw,38px);line-height:1.1;letter-spacing:-.045em}
  .result strong{font-size:clamp(28px,8vw,38px);line-height:1.09;letter-spacing:-.045em}
  .result span{line-height:1.6}
  .nextbox h3{font-size:clamp(26px,7.8vw,34px);line-height:1.12}
  .visual-footer span{line-height:1.35}
}
@media(max-width:420px){
  .stats{grid-template-columns:1fr}
  .hero h1{font-size:clamp(36px,10.7vw,45px)}
  .section h2{font-size:clamp(29px,8.5vw,36px)}
  .nextbox{align-items:flex-start}
}
'''
          css.write_text(ctext, encoding='utf-8')

          # Static safety checks.
          assert 'manifesto-line' in text
          assert 'v1.7 — responsive typography / clipping defense' in text
          assert 'v1.7 — mobile typography / clipping defense' in ctext
          assert text.count('</style>') == 1
          print('PATCH_OK')
          PY

      - name: Install Korean font and browser helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm install puppeteer-core@24 --no-save --no-package-lock >/dev/null 2>&1

      - name: Render typography QA
        run: |
          python3 -m http.server 8000 >/tmp/portfolio-http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/type-qa
          cat > /tmp/type-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import {execSync} from 'node:child_process';
          const chrome=execSync('command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser',{encoding:'utf8',shell:'/bin/bash'}).trim();
          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});
          const shots=[
            ['career-390','http://127.0.0.1:8000/index.html#career',390,844,'#career'],
            ['projects-390','http://127.0.0.1:8000/index.html#projects',390,844,'#projects'],
            ['impact-390','http://127.0.0.1:8000/index.html#impact',390,844,'#impact'],
            ['career-1440','http://127.0.0.1:8000/index.html#career',1440,1000,'#career'],
            ['school-390','http://127.0.0.1:8000/projects/schoolbridge.html',390,844,'.hero'],
            ['proc-390','http://127.0.0.1:8000/projects/procurement-logistics-ai.html',390,844,'.hero'],
            ['rainbow-results-390','http://127.0.0.1:8000/projects/rainbow-bridge.html#results',390,844,'#results'],
            ['jobiverse-results-390','http://127.0.0.1:8000/projects/jobiverse.html#results',390,844,'#results']
          ];
          for(const [name,url,w,h,sel] of shots){
            const page=await browser.newPage();
            await page.setViewport({width:w,height:h,deviceScaleFactor:1});
            await page.goto(url,{waitUntil:'networkidle0'});
            await page.evaluate(s=>document.querySelector(s)?.scrollIntoView({block:'start'}),sel);
            await new Promise(r=>setTimeout(r,300));
            const overflow=await page.evaluate(()=>({w:innerWidth,sw:document.documentElement.scrollWidth}));
            if(overflow.sw>overflow.w+2) throw new Error(`${name}: horizontal overflow ${overflow.sw-overflow.w}px`);
            await page.screenshot({path:`/tmp/type-qa/${name}.png`,fullPage:false});
            await page.close();
          }
          await browser.close();
          JS
          node /tmp/type-qa.mjs
          ls -lh /tmp/type-qa

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: responsive-type-qa
          path: /tmp/type-qa/*.png
          retention-days: 2

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/mobile-type-polish.yml
          git add index.html assets/case-study.css .github/workflows/mobile-type-polish.yml
          git diff --cached --check
          git commit -m "fix: prevent responsive typography clipping"
          git push origin main
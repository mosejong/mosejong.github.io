name: Portfolio v1.1 Release Polish

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-polish-v11.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow

      - name: Apply factual, SEO and social preview polish
        run: python .github/scripts/release_polish_v11.py

      - name: Check generated OG dimensions and local links
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path('assets/og').glob('*.png'):
              im=Image.open(p)
              assert im.size == (1200,630), (p, im.size)
              print(p, im.size, p.stat().st_size)
          PY
          git diff --check

      - name: Commit release polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects assets robots.txt sitemap.xml
          git commit -m "feat: polish portfolio facts, SEO and social previews"
          git push

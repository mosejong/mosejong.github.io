name: Rename Resume Labels

on:
  push:
    paths:
      - '.github/workflows/rename-resume-label.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename resume labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if s.count('Resume PDF ↗') != 1:
              raise SystemExit(f'Unexpected Resume PDF count: {s.count("Resume PDF ↗")}')
          if s.count('Resume ↗') != 1:
              raise SystemExit(f'Unexpected Resume count: {s.count("Resume ↗")}')
          s = s.replace('Resume PDF ↗', '이력서 PDF ↗')
          s = s.replace('Resume ↗', '이력서 PDF ↗')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rename-resume-label.yml
          git add index.html .github/workflows/rename-resume-label.yml
          git diff --cached --check
          git commit -m "copy: rename resume buttons to 이력서 PDF"
          git push origin main

name: Portfolio Benchmark Visual QA

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/visual-benchmark-v16.yml"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f
      - name: Capture focused screenshots
        run: |
          python3 -m http.server 8000 >/tmp/portfolio-http.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          mkdir -p qa
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=1440,1200 --screenshot=qa/home-impact-desktop.png 'http://127.0.0.1:8000/#impact'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=1440,1200 --screenshot=qa/home-projects-desktop.png 'http://127.0.0.1:8000/#projects'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=390,844 --screenshot=qa/home-impact-mobile.png 'http://127.0.0.1:8000/#impact'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=390,844 --screenshot=qa/home-projects-mobile.png 'http://127.0.0.1:8000/#projects'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=1440,1200 --screenshot=qa/jobiverse-results-desktop.png 'http://127.0.0.1:8000/projects/jobiverse.html#results'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=390,844 --screenshot=qa/jobiverse-results-mobile.png 'http://127.0.0.1:8000/projects/jobiverse.html#results'
          ls -lh qa
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-benchmark-focused-v16
          path: qa/

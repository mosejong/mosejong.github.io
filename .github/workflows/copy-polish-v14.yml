name: Portfolio Copy Polish v1.4

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/copy-polish-v14.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Polish portfolio copy
        run: python .github/scripts/copy_polish_v14.py

      - name: Validate
        run: |
          git diff --check
          ! grep -R "포트폴리오를 지향합니다" index.html projects
          ! grep -R "보고 싶었습니다" projects/procurement-logistics-ai.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects
          git commit -m "copy: make portfolio language outcome-first"
          git push

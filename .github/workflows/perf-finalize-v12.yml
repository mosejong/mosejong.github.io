name: Portfolio v1.2 Finalize

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/perf-finalize-v12.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Finalize loading and accessibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          main=root/'index.html'
          s=main.read_text(encoding='utf-8')
          s=s.replace('>LIVE DEMO GIF</span>', '>LIVE DEMO</span>')
          focus='\n    /* PERF_V12_A11Y */\n    a:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}\n'
          if 'PERF_V12_A11Y' not in s:
              s=s.replace('  </style>', focus+'  </style>',1)
          assert 'LIVE DEMO GIF' not in s
          assert 'data-demo-video' in s
          assert 'loading="lazy" decoding="async"' in s
          main.write_text(s,encoding='utf-8')

          hero_exact={
            'schoolbridge.html': ('schoolbridge-parent.webp','SchoolBridge 학부모 UI 디자인 레퍼런스'),
            'procurement-logistics-ai.html': ('procurement-home.webp','공공조달 수요 기반 입지 물류 분석 대시보드'),
          }
          for p in (root/'projects').glob('*.html'):
              t=p.read_text(encoding='utf-8')
              # Local screenshots below the fold load lazily; hero screenshot is restored to eager/high priority below.
              def lazy(m):
                  tag=m.group(0)
                  tag=re.sub(r'\s+(?:loading|decoding|fetchpriority)="[^"]*"','',tag)
                  return tag[:-1]+' loading="lazy" decoding="async">'
              t=re.sub(r'<img src="\.\./assets/projects/[^"]+\.webp"[^>]*>',lazy,t)
              if p.name in hero_exact:
                  stem,alt=hero_exact[p.name]
                  pat=re.compile(r'<img src="\.\./assets/projects/'+re.escape(stem)+r'" alt="'+re.escape(alt)+r'"[^>]*>')
                  t,n=pat.subn(f'<img src="../assets/projects/{stem}" alt="{alt}" decoding="async" fetchpriority="high">',t,count=1)
                  assert n==1,(p,n)
              p.write_text(t,encoding='utf-8')

          css=root/'assets'/'case-study.css'
          c=css.read_text(encoding='utf-8')
          if 'PERF_V12_A11Y' not in c:
              c+='/*PERF_V12_A11Y*/a:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}'
          css.write_text(c,encoding='utf-8')

          joined='\n'.join(x.read_text(encoding='utf-8') for x in [main,*sorted((root/'projects').glob('*.html'))])
          assert 'raw.githubusercontent.com' not in joined
          assert not re.search(r'<img[^>]+\.gif',joined,re.I)
          assert 'LIVE DEMO GIF' not in joined
          print('FINAL STATIC VALIDATION PASS')
          PY
          git diff --check

      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects assets/case-study.css
          git commit -m "perf: finalize lazy loading and keyboard focus"
          git push

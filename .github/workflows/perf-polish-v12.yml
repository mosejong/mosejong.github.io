name: Portfolio v1.2 Performance Polish

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/perf-polish-v12.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg webp

      - name: Optimize portfolio media
        run: python .github/scripts/perf_polish_v12.py

      - name: Validate diff
        run: |
          git diff --check
          test -s assets/projects/jobiverse-final-report.mp4
          test -s assets/projects/jobiverse-simulation.mp4
          test -s assets/projects/rainbow-bridge-demo.mp4

      - name: Commit optimized media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects assets
          git commit -m "perf: optimize portfolio demo media"
          git push

name: Wire Case Study Links

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/link-case-studies.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update project card links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<a class="project-btn primary" href="https://github.com/neunglog-sys/job_simulator#-about-the-project" target="_blank" rel="noreferrer">View Case Study ↗</a>': '<a class="project-btn primary" href="projects/jobiverse.html">View Case Study →</a>',
            '<a class="project-btn primary" href="https://github.com/Maxmunzy/multicultural-ai" target="_blank" rel="noreferrer">View Project ↗</a>': '<a class="project-btn primary" href="projects/schoolbridge.html">View Case Study →</a>',
            '<a class="project-btn primary" href="https://github.com/mosejong/Rainbow-Bridge" target="_blank" rel="noreferrer">View Project ↗</a>': '<a class="project-btn primary" href="projects/rainbow-bridge.html">View Case Study →</a>',
            '<a class="project-btn primary" href="https://procurement-logistics-ai-5qian47widxpcuqefpjipy.streamlit.app" target="_blank" rel="noreferrer">Live Demo ↗</a>\n        <a class="project-btn" href="https://github.com/mosejong/procurement-logistics-ai" target="_blank" rel="noreferrer">GitHub ↗</a>': '<a class="project-btn primary" href="projects/procurement-logistics-ai.html">View Case Study →</a>\n        <a class="project-btn" href="https://procurement-logistics-ai-5qian47widxpcuqefpjipy.streamlit.app" target="_blank" rel="noreferrer">Live Demo ↗</a>\n        <a class="project-btn" href="https://github.com/mosejong/procurement-logistics-ai" target="_blank" rel="noreferrer">GitHub ↗</a>'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected link block not found: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-off workflow and validate
        run: |
          git rm .github/workflows/link-case-studies.yml
          grep -q 'projects/jobiverse.html' index.html
          grep -q 'projects/schoolbridge.html' index.html
          grep -q 'projects/rainbow-bridge.html' index.html
          grep -q 'projects/procurement-logistics-ai.html' index.html
          test -f assets/case-study.css
          test -f projects/jobiverse.html
          test -f projects/schoolbridge.html
          test -f projects/rainbow-bridge.html
          test -f projects/procurement-logistics-ai.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: link portfolio cards to case studies"
          git push
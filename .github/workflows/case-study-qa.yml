name: Case Study Visual QA

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/case-study-qa.yml"

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Korean fonts
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          fc-cache -f

      - name: Serve portfolio
        run: |
          python3 -m http.server 8123 >/tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          sleep 2
          mkdir -p /tmp/case-study-qa

      - name: Capture desktop and mobile
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=/tmp/case-study-qa/01-jobiverse-desktop.png http://127.0.0.1:8123/projects/jobiverse.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=/tmp/case-study-qa/02-schoolbridge-desktop.png http://127.0.0.1:8123/projects/schoolbridge.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=/tmp/case-study-qa/03-rainbow-desktop.png http://127.0.0.1:8123/projects/rainbow-bridge.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=/tmp/case-study-qa/04-procurement-desktop.png http://127.0.0.1:8123/projects/procurement-logistics-ai.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=6000 --screenshot=/tmp/case-study-qa/05-jobiverse-mobile.png http://127.0.0.1:8123/projects/jobiverse.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=6000 --screenshot=/tmp/case-study-qa/06-procurement-mobile.png http://127.0.0.1:8123/projects/procurement-logistics-ai.html
          kill "$(cat /tmp/portfolio-http.pid)" || true

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: case-study-visual-qa
          path: /tmp/case-study-qa/*.png
          retention-days: 7

      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/case-study-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove case study QA workflow"
          git push
name: Portfolio Copy Accuracy v1.5

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/copy-accuracy-v15.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply final SchoolBridge wording patch
        run: python .github/scripts/copy_accuracy_v15b.py

      - name: Validate
        run: |
          git diff --check
          grep -q "project backend tests" projects/schoolbridge.html
          grep -q "학교 공지 사용 맥락" projects/schoolbridge.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/schoolbridge.html
          git commit -m "copy: clarify SchoolBridge validation wording"
          git push

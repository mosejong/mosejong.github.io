name: Apply Jobiverse Portfolio Card

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-jobiverse-card.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Jobiverse card
        run: python scripts/apply_jobiverse.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: upgrade Jobiverse case study card"
          git push

name: Live Pages Verify v1.8

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/live-deploy-verify-v18.yml"

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Wait for GitHub Pages and verify live HTML
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            echo "Attempt $i/36"
            ROOT=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://mosejong.github.io/?verify=${GITHUB_SHA}-${i}" || true)
            JOB=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://mosejong.github.io/projects/jobiverse.html?verify=${GITHUB_SHA}-${i}" || true)
            SCHOOL=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "https://mosejong.github.io/projects/schoolbridge.html?verify=${GITHUB_SHA}-${i}" || true)

            if [[ "$ROOT" == *"Seoul · AI 서비스 백엔드 개발자"* ]] \
              && [[ "$ROOT" == *"누적 8Y 9M"* ]] \
              && [[ "$ROOT" == *"🏆 최우수상"* ]] \
              && [[ "$ROOT" != *"Seoul · AI Service Backend</span>"* ]] \
              && [[ "$JOB" == *"37개 체험 시나리오 직접 매핑"* ]] \
              && [[ "$JOB" == *"전체 추천 체계는 38개 직무군"* ]] \
              && [[ "$SCHOOL" == *"🏆 최우수상"* ]]; then
              echo "LIVE VERIFY PASS"
              ok=1
              break
            fi
            sleep 5
          done

          if [[ "$ok" != "1" ]]; then
            echo "LIVE VERIFY FAILED"
            echo "root_new_role=$([[ "$ROOT" == *"Seoul · AI 서비스 백엔드 개발자"* ]] && echo yes || echo no)"
            echo "root_career=$([[ "$ROOT" == *"누적 8Y 9M"* ]] && echo yes || echo no)"
            echo "root_award=$([[ "$ROOT" == *"🏆 최우수상"* ]] && echo yes || echo no)"
            echo "job_mapping=$([[ "$JOB" == *"37개 체험 시나리오 직접 매핑"* ]] && echo yes || echo no)"
            echo "school_award=$([[ "$SCHOOL" == *"🏆 최우수상"* ]] && echo yes || echo no)"
            exit 1
          fi

      - name: Self-clean after successful verification
        run: |
          rm .github/workflows/live-deploy-verify-v18.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove live deployment verifier"
          git push

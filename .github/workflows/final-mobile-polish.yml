name: Final Mobile Polish

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/final-mobile-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix mobile awards dock
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""      .awards-dock{\n        right:12px;top:auto;bottom:14px;width:min(360px,calc(100vw - 24px));\n        transform:translateY(calc(100% - 49px))\n      }\n      .awards-dock:hover{transform:translateY(calc(100% - 49px))}\n      .awards-dock.open{transform:translateY(0)}"""
          new="""      .awards-dock{\n        right:12px;top:auto;bottom:14px;width:min(360px,calc(100vw - 24px));\n        transform:translateY(100%)\n      }\n      .awards-dock:hover{transform:translateY(100%)}\n      .awards-dock.open{transform:translateY(0)}"""
          if old not in s:
              raise SystemExit('mobile awards CSS marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Mobile awards dock now stays fully closed until tap.')
          PY

      - name: Validate
        run: |
          grep -q 'transform:translateY(100%)' index.html
          test -s assets/projects/schoolbridge-parent.png
          test -s assets/projects/schoolbridge-teacher.png
          test -s assets/projects/procurement-home.png

      - name: Commit mobile polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: keep awards dock closed on mobile"
          git push
